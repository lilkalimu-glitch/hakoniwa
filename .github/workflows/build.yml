name: Hakoniwa bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.2'
  QEMU_VERSION: '11.0.3'
  QEMU_SHA256: 'da5fcffc32762820568b828ed430a728864d34d50b6d2f30358597760cbb0523'
  GLIB_VERSION: '2.88.4'
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '31'
  GRADLE_VERSION: '8.11.1'

jobs:
  os:
    name: Betriebssysteme bauen und testen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld qemu-system-arm

      - name: Mein OS bauen
        run: make -C mein-os

      - name: Beispiel bauen
        run: make -C beispiel-os

      - name: Mein OS in QEMU testen
        shell: bash
        run: python3 tests/test_mein_os.py qemu-system-aarch64 mein-os/kernel.elf 2>&1 | tee mein-os-test.log

      - name: Beispiel in QEMU testen
        shell: bash
        run: python3 tests/test_os.py qemu-system-aarch64 beispiel-os/kernel.elf 2>&1 | tee os-test.log

      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-os
          path: |
            mein-os-test.log
            os-test.log
          if-no-files-found: ignore

      - name: Kernel speichern
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            mein-os/kernel.elf
            beispiel-os/kernel.elf

  qemu:
    name: QEMU fürs Handy bauen (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Zwischenspeicher
        id: cache
        uses: actions/cache@v4
        with:
          path: out/qemu-${{ matrix.abi }}
          key: qemu-${{ matrix.abi }}-${{ env.QEMU_VERSION }}-${{ env.GLIB_VERSION }}-${{ env.NDK_VERSION }}-${{ env.ANDROID_API }}-${{ hashFiles('qemu/**') }}

      - name: Python einrichten
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build pkg-config
          python -m pip install --quiet meson packaging

      - name: Android-NDK installieren
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: QEMU bauen
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash qemu/build-android.sh ${{ matrix.abi }} 2>&1 | tee build-qemu.log

      - name: QEMU speichern
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.abi }}
          path: out/qemu-${{ matrix.abi }}/libqemu.so

      - name: Protokolle kürzen
        if: always()
        run: |
          mkdir -p logs
          [ -f build-qemu.log ] && tail -n 3000 build-qemu.log > logs/build-qemu.log || true
          for f in build/android-*/glib-build/meson-logs/meson-log.txt; do
            [ -f "$f" ] && tail -n 400 "$f" > logs/glib-meson-log.txt
          done
          for f in build/android-*/qemu-*/build/meson-logs/meson-log.txt; do
            [ -f "$f" ] && tail -n 600 "$f" > logs/qemu-meson-log.txt
          done
          ls -la logs

      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-qemu-${{ matrix.abi }}
          path: logs
          if-no-files-found: ignore

  arm64:
    name: QEMU fürs Handy auf ARM testen
    needs: [os, qemu]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Kernel holen
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: kernels

      - name: QEMU (arm64) holen
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm64-v8a
          path: arm64

      - name: Android-Umgebung holen (Termux-Docker)
        shell: bash
        run: |
          for versuch in 1 2 3 4 5; do
            if docker pull -q termux/termux-docker:aarch64 2>&1 | tee -a docker-pull.log; then
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, warte kurz ..." | tee -a docker-pull.log
            sleep $((versuch * 15))
          done
          exit 1

      - name: Beide Systeme mit der Handy-Version von QEMU testen
        shell: bash
        env:
          IDLE_CHECK: '0'
        run: |
          chmod 755 arm64/libqemu.so
          QEMU="docker run -i --rm --privileged -v $PWD:/work termux/termux-docker:aarch64 /work/arm64/libqemu.so"
          python3 tests/test_mein_os.py "$QEMU" /work/kernels/mein-os/kernel.elf 2>&1 | tee arm64-test.log
          python3 tests/test_os.py "$QEMU" /work/kernels/beispiel-os/kernel.elf 2>&1 | tee -a arm64-test.log

      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-arm64
          path: |
            arm64-test.log
            docker-pull.log
          if-no-files-found: ignore

  app:
    name: Android-App bauen
    needs: [os, qemu]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Kernel holen
        uses: actions/download-artifact@v4
        with:
          name: kernel
          path: kernels

      - name: Kernel in die App legen
        run: |
          mkdir -p app/src/main/assets
          cp kernels/mein-os/kernel.elf app/src/main/assets/mein-os.elf
          cp kernels/beispiel-os/kernel.elf app/src/main/assets/beispiel.elf

      - name: QEMU (arm64) holen
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a

      - name: QEMU (x86_64) holen
        uses: actions/download-artifact@v4
        with:
          name: qemu-x86_64
          path: app/src/main/jniLibs/x86_64

      - name: Dateien prüfen
        run: |
          chmod 755 app/src/main/jniLibs/*/libqemu.so
          ls -la app/src/main/assets app/src/main/jniLibs/*

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle installieren
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: App-Schlüssel entschlüsseln
        id: key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning title=Secret fehlt::KEYSTORE_PASSWORD fehlt. Die APK wird nur zum Testen signiert und nicht veröffentlicht."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/pw"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/hakoniwa.p12.enc \
            -out "$RUNNER_TEMP/hakoniwa.p12" -pass file:"$RUNNER_TEMP/pw" \
            || { echo "::error title=Falsches Passwort::KEYSTORE_PASSWORD passt nicht zum Schlüssel."; exit 1; }
          rm -f "$RUNNER_TEMP/pw"
          echo "HAKONIWA_KEYSTORE=$RUNNER_TEMP/hakoniwa.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        shell: bash
        env:
          HAKONIWA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --console=plain \
            -Phakoniwa.versionCode=${{ github.run_number }} \
            -Phakoniwa.versionName=$APP_VERSION.${{ github.run_number }} 2>&1 | tee gradle.log
          ls -la app/build/outputs/apk/release/

      - name: APKs speichern
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/hakoniwa.p12"

      - name: Gradle-Protokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-app
          path: gradle.log
          if-no-files-found: ignore

  test:
    name: App im Android-Emulator testen
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: APKs holen
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator starten und App testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/emulator_test.sh apks/app-x86_64-release.apk emulator-ergebnis

      - name: Ergebnis speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-emulator
          path: emulator-ergebnis
          if-no-files-found: ignore

  release:
    name: APK veröffentlichen
    needs: [app, test, arm64]
    if: needs.app.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: APKs holen
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$APP_VERSION.${{ github.run_number }}"
          cp apks/app-arm64-v8a-release.apk "Hakoniwa-$VERSION.apk"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "Hakoniwa-$VERSION.apk" --clobber --repo "${{ github.repository }}"
            exit 0
          fi
          gh release create "v$VERSION" "Hakoniwa-$VERSION.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Hakoniwa $VERSION" \
            --notes "APK fürs Handy. Einfach öffnen und installieren, neue Versionen über die alte installieren." \
            --latest

  ergebnis:
    name: Ergebnisse speichern
    needs: [os, qemu, arm64, app, test, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Protokolle holen
        uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: ergebnis

      - name: Zusammenfassung schreiben
        run: |
          mkdir -p ergebnis
          cat > ergebnis/ZUSAMMENFASSUNG.md <<EOF
          # Lauf ${{ github.run_number }}

          Commit: ${{ github.sha }}

          | Schritt | Ergebnis |
          | --- | --- |
          | Betriebssysteme | ${{ needs.os.result }} |
          | QEMU fürs Handy | ${{ needs.qemu.result }} |
          | QEMU auf ARM getestet | ${{ needs.arm64.result }} |
          | Android-App | ${{ needs.app.result }} |
          | Test im Emulator | ${{ needs.test.result }} |
          | Veröffentlichen | ${{ needs.release.result }} |
          EOF
          find ergebnis -type f | sort

      - name: In den Zweig ci-ergebnis schreiben
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd ergebnis
          git init -q -b ci-ergebnis
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Ergebnisse von Lauf ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-ergebnis
